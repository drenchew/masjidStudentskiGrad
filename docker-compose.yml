version: '3.8'

services:
  # Backend API (uses Render managed database)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masjid-backend
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required (use Render Postgres)}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - STRIPE_API_KEY=${STRIPE_API_KEY:?STRIPE_API_KEY is required}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - EMAIL_FROM=${EMAIL_FROM:?EMAIL_FROM is required}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?MAIL_USERNAME is required}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - masjid-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
        - VITE_STRIPE_PK=${VITE_STRIPE_PK:?VITE_STRIPE_PK is required}
    container_name: masjid-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - masjid-network
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_logs:

networks:
  masjid-network:
    driver: bridge
