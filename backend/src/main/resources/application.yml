spring:
  application:
    name: masjid-studentski-grad
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/masjid_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  forward-headers-strategy: framework  # Handle X-Forwarded-* headers from reverse proxy
  
# Application specific properties
app:
  jwt:
    secret: ${JWT_SECRET:}  # MUST be set via environment variable (no default for security)
    expiration: ${JWT_EXPIRATION:86400000}
  
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  
  prayer-times:
    api-url: https://islamicapi.com/api/v1/prayer-time
    latitude: 42.6977
    longitude: 23.3219
    method: 13
    school: 1
    api-key: ${ISLAMIC_API_KEY:}
    backup-api-url: https://api.aladhan.com/v1/timingsByCity
    city: Sofia
    country: Bulgaria
  
  file-storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  
  email:
    from: ${EMAIL_FROM:masjid@studentskigrad.com}
    brevo-api-key: ${BREVO_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: WHEN_AUTHORIZED

logging:
  level:
    root: INFO
    com.masjid: DEBUG
    org.springframework.security: DEBUG
