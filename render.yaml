# Render Blueprint for Masjid Studentski Grad
# This file defines all services for automatic deployment

services:
  # Backend - Spring Boot API
  - type: web
    name: masjid-backend
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    region: frankfurt  # Choose closest region
    healthCheckPath: /api/prayer-times
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: masjid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: masjid-frontend
          type: web
          property: host
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PORT
        value: 8080

  # Frontend - React + Vite
  - type: web
    name: masjid-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: masjid-backend
          type: web
          property: host
      - key: VITE_STRIPE_PK
        sync: false

# Database - PostgreSQL
databases:
  - name: masjid-db
    plan: free
    databaseName: masjid_db
    user: masjid_user
