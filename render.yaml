services:
  # PostgreSQL Database
  - type: pserv
    name: masjid-postgres
    env: docker
    plan: free
    image:
      url: docker.io/postgres:15-alpine
    envVars:
      - key: POSTGRES_DB
        value: masjid_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
    # NOTE: persistent disks are not supported on free tier services.
    # If you need persistent storage on Render, upgrade the plan and
    # add a disk section here.

  # Backend Spring Boot Application
  - type: web
    name: masjid-backend
    env: docker
    plan: free
    # Use the backend Dockerfile for build (Render will build the image).
    dockerfilePath: backend/Dockerfile
    # startCommand must not be provided for docker services; Render will
    # run the container using the Dockerfile's CMD. If you need a custom
    # runtime command, set it in the Dockerfile instead.
    envVars:
      - key: DATABASE_URL
        # Can't reference connectionString property from a pserv in the
        # free-tier blueprint validation. Set this manually in the Render
        # dashboard to the connection string for the managed Postgres
        # (or construct it from host/port/user/password provided by the DB
        # service).
        sync: false
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        fromService:
          type: pserv
          name: masjid-postgres
          envVarKey: POSTGRES_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: masjid-frontend
          property: host
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
    healthCheckPath: /actuator/health
    # NOTE: Uploads/persistent disk not configured because free tier services
    # do not support disks. If you require uploads to persist across
    # deployments, enable an external storage (S3, Cloud Storage) or upgrade
    # the Render plan and add a disk here.

  # Frontend React Application
  - type: web
    name: masjid-frontend
    env: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: masjid-backend
          property: host
      - key: VITE_STRIPE_PK
        sync: false
