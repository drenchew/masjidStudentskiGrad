services:
  # PostgreSQL Database
  - type: pserv
    name: masjid-postgres
    env: docker
    plan: free
    image:
      url: docker.io/postgres:15-alpine
    envVars:
      - key: POSTGRES_DB
        value: masjid_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: masjid-db-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Backend Spring Boot Application
  - type: web
    name: masjid-backend
    env: java
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: cd backend && java -Dserver.port=$PORT -jar target/*.jar
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: masjid-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        fromService:
          type: pserv
          name: masjid-postgres
          envVarKey: POSTGRES_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: masjid-frontend
          property: host
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
    healthCheckPath: /actuator/health
    disk:
      name: masjid-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # Frontend React Application (Static Site)
  - type: web
    name: masjid-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s dist -l $PORT
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: masjid-backend
          property: host
      - key: VITE_STRIPE_PK
        sync: false
