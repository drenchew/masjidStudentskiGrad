services:
  # PostgreSQL Database
  - type: pserv
    name: masjid-postgres
    env: docker
    plan: free
    image:
      url: docker.io/postgres:15-alpine
    envVars:
      - key: POSTGRES_DB
        value: masjid_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
    # Disk for persistent storage (only on paid plans)
    # disk:
    #   name: postgres-data
    #   mountPath: /var/lib/postgresql/data
    #   sizeGB: 10

  # Backend Spring Boot Application (Docker)
  - type: web
    name: masjid-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        # Set this manually in Render dashboard after postgres is created
        # Format: jdbc:postgresql://masjid-postgres:5432/masjid_db
        sync: false
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        fromService:
          type: pserv
          name: masjid-postgres
          envVarKey: POSTGRES_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://masjid-frontend.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads
    healthCheckPath: /actuator/health
    # Disk for file uploads (only on paid plans)
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 5

  # Frontend React Application (Docker with Nginx)
  - type: web
    name: masjid-frontend
    env: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    dockerCommand: nginx -g "daemon off;"
    envVars:
      - key: VITE_API_URL
        value: https://masjid-backend.onrender.com
      - key: VITE_STRIPE_PK
        sync: false
    # Frontend routes through nginx, health check on root
    healthCheckPath: /
          name: masjid-backend
          property: host
      - key: VITE_STRIPE_PK
        sync: false
