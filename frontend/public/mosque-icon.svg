<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dome -->
  <ellipse cx="50" cy="35" rx="25" ry="20" fill="#2d5a3d"/>
  
  <!-- Main building -->
  <rect x="20" y="40" width="60" height="50" fill="#4a7c59"/>
  
  <!-- Door -->
  <rect x="42" y="60" width="16" height="30" fill="#1a3a2a"/>
  
  <!-- Door handle -->
  <circle cx="58" cy="75" r="2" fill="#d4af37"/>
  
  <!-- Left minaret -->
  <rect x="15" y="30" width="8" height="60" fill="#2d5a3d"/>
  <circle cx="19" cy="28" r="5" fill="#2d5a3d"/>
  
  <!-- Right minaret -->
  <rect x="77" y="30" width="8" height="60" fill="#2d5a3d"/>
  <circle cx="81" cy="28" r="5" fill="#2d5a3d"/>
  
  <!-- Crescent moon symbol on dome -->
  <path d="M 45 30 Q 50 25 55 30" stroke="#d4af37" stroke-width="2" fill="none"/>
</svg>
