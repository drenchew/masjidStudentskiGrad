server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: https://img.youtube.com; connect-src 'self' https://api.stripe.com https://api.aladhan.com; frame-src https://js.stripe.com https://www.youtube-nocookie.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hide server version
    server_tokens off;

    # Limit request body size
    client_max_body_size 10m;

    # Rate limiting zone (10 requests per second per IP)
    # Note: This needs to be in the http block, typically in the main nginx.conf
    # limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # limit_req zone=general burst=20 nodelay;

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Prevent accessing hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Block access to sensitive files
    location ~* \.(env|git|gitignore|dockerignore|md|yml|yaml|toml|lock)$ {
        deny all;
        return 404;
    }

    # Proxy API requests to backend (if needed)
    # location /api {
    #     proxy_pass http://backend:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
